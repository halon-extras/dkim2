    id: dkim2_rsa_test_key.private
  - data: "import { dkim2_sign } from \"extras://dkim2\";\n\n$mail = MailMessage::File(File(\"\
      simple_email.eml\"));\n$privatekeystring = File::read(\"dkim2_ed25519_test_key.private\"\
      );\n$privatekey = ed25519_privatekey($privatekeystring);\n$rcptto = [\"recipient@example.com\"\
      ];\n\n$tests = [\n    [\n        \"name\" => \"Has exploded and timestamp\"\
      ,\n        \"options\" => [\n            \"timestamp\" => 1740000000,\n    \
      \        \"exploded\" => true,\n        ],\n        \"expected\" => [\n    \
      \        \"f\" => \"exploded\",\n            \"t\" => 1740000000\n        ]\n\
      \    ],\n    [\n        \"name\" => \"Has exploded, timestamp and nonce\",\n\
      \        \"options\" => [\n            \"timestamp\" => 1740000000,\n      \
      \      \"nonce\" => \"test-nonce\",\n            \"exploded\" => true,\n   \
      \         \"feedback\" => false,\n        ],\n        \"expected\" => [\n  \
      \          \"t\" => 1740000000,\n            \"f\" => \"exploded\",\n      \
      \      \"n\" => \"test-nonce\"\n        ]\n    ],\n    [\n        \"name\" =>\
      \ \"Has donotmodify, donotexplode and timestamp\",\n        \"options\" => [\n\
      \            \"timestamp\" => 1740000000,\n            \"donotmodify\" => true,\n\
      \            \"donotexplode\" => true,\n        ],\n        \"expected\" =>\
      \ [\n            \"t\" => 1740000000, \n            \"f\" => \"donotexplode,donotmodify\"\
      \n        ]\n    ],\n    [\n        \"name\" => \"Has feedback, exploded and\
      \ timestamp\",\n        \"options\" => [\n            \"timestamp\" => 1740000000,\n\
      \            \"feedback\" => true,\n            \"exploded\" => true\n     \
      \   ],\n        \"expected\" => [\n            \"t\" => 1740000000,\n      \
      \      \"f\" => \"feedback,exploded\"\n        ]\n    ]\n];\n\nforeach ($tests\
      \ as $test) {\n    $signed = dkim2_sign(\n        $mail->toFile(),\n       \
      \ \"sender@test1.dkim2.com\",\n        $rcptto,\n        \"ed25519\",\n    \
      \    \"test1.dkim2.com\",\n        $privatekey,\n        $test[\"options\"]\n\
      \    );\n\n    foreach ($signed[\"headers\"] as $header)\n        $mail->modifyContent(0,\
      \ 0, $header);\n\n    $tags = header_dkim_decode(\n        MailMessage::String($mail->toString())->getHeader(\"\
      Dkim2-Signature\")\n    );\n\n    foreach ($test[\"expected\"] as $tag => $expected)\
      \ {\n        if ($tags[$tag] != $expected)\n            throw Exception($test[\"\
      name\"] . \" failed: unexpected \" . $tag . \" tag\");\n    }\n\n    $mail->reset();\n\
      }\n\necho \"test ok\";"
    id: dkim2_sign_test.hsl
  - data: |-
      import { dkim2_sign } from "extras://dkim2";

      $mail = MailMessage::File(File("simple_email.eml"));
      $privatekeystring = File::read("dkim2_rsa_test_key.private");
      $rcptto = ["recipient@example.com"];

      $privatekey = rsa_privatekey($privatekeystring);

      $signed = dkim2_sign(
          $mail->toFile(),
          "sender@test1.dkim2.com",
          $rcptto,
          "rsa1024",
          "test1.dkim2.com",
          $privatekey,
          [
          "timestamp" => 1740000000,
          "exploded" => true,
          ]
      );

      foreach ($signed["headers"] as $header)
          $mail->modifyContent(0, 0, $header);

      $tags = header_dkim_decode(MailMessage::String($mail->toString())->getHeader("Dkim2-Signature"));
      if ($tags["f"] != "exploded") {
          throw Exception("fail: f= does not equal 'exploded'");
      }
      if ($tags["t"] != "1740000000") {
          throw Exception("fail: t= does not equal '1740000000'");
      }

      echo "test ok";
    id: dkim2_sign_test_rsa.hsl
  - data: "import { dkim2_verify } from \"extras://dkim2\";\n\n$mail = MailMessage::File(File(\"\
      simple_email_signed.eml\"));\n\n$rcptto = [\"recipient@example.com\"];\n\n$dkim2options\
      \ = [\n    \"ignoretimestamp\" => true,\n    \"timeout\" => 10\n];\n\n$verified\
      \ = dkim2_verify($mail->toFile(), \"sender@test1.dkim2.com\", $rcptto, $dkim2options);\n\
      \nif (!$verified[\"result\"]) \n{\n    echo \"dkim2 signature not found\";\n\
      }\n\nelse if ($verified[\"result\"] != \"pass\")\n{\n    throw $verified[\"\
      error\"];\n} \nelse \n{\n    echo \"verfied ok!\";\n}\n"
    id: dkim2_verify_test.hsl
